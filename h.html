<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 2026</title>
  </head>
  <body>
    <style>
      body {
        background-color: rgb(119, 114, 114);
      }
    </style>

    <p>
      <button onClick="setLocalStorage('username', 'sumit')">
        Set local storage username
      </button>
    </p>
    <p>
      <button onClick="getLocalStorage('username')">
        Get local storage username
      </button>
    </p>
    <p>
      <button onClick="setLocalStorage('name', 'Sumit Saha')">
        Set local storage name
      </button>
    </p>
    <p>
      <button onClick="getLocalStorage('name')">Get local storage name</button>
    </p>
    <p>
      <button onClick="removeLocalStorage('name')">
        Remove local storage name
      </button>
    </p>
    <p>
      <button onClick="clearLocalStorage()">Clear local storage</button>
    </p>

    <script src="./webApi/storageApi.js"></script>
  </body>
</html>
