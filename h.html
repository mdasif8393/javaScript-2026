<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 2026</title>
  </head>
  <body>
    <style>
      body {
        background-color: rgb(119, 114, 114);
      }
    </style>

    <div>
      <input
        type="button"
        value="Set Name Cookie"
        onclick="setCookie('name', 'Sumit Saha', 2)"
      />
    </div>

    <div>
      <input
        type="button"
        value="Set UserName Cookie"
        onclick="setCookie('username', 'sumit', 2)"
      />
    </div>

    <div>
      <input
        type="button"
        value="Get Name Cookie"
        onclick="alert(getCookie('name'))"
      />
    </div>

    <div>
      <input
        type="button"
        value="Get UserName Cookie"
        onclick="alert(getCookie('username'))"
      />
    </div>

    <script src="./bom/cookie.js"></script>
  </body>
</html>
