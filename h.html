<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 2026</title>
  </head>
  <body>
    <style>
      body {
        background-color: rgb(119, 114, 114);
      }
    </style>

    <p id="p1">
      This is a text. This is a text. This is a text. This is a text.
    </p>
    <button
      onclick="document.getElementById('p1').style.visibility = 'visible'"
    >
      Show
    </button>
    <button onclick="document.getElementById('p1').style.visibility = 'hidden'">
      Hide
    </button>
    <script src="./dom/changingCss.js"></script>
  </body>
</html>
